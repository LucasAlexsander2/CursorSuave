name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  VPK_VERSION: 1.2.161
  DOTNET_ROLL_FORWARD: Major  # deixa o vpk rodar no .NET 10 se o runtime dele não estiver no runner
  REPO_URL: https://github.com/LucasAlexsander2/CursorSuave

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Versão a partir da tag
        shell: bash
        run: echo "VERSAO=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Testes
        run: dotnet test -c Release -v q --nologo

      - name: Publicar (self-contained win-x64)
        run: dotnet publish src/CursorSuave -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSAO }} -o publish

      - name: Instalar vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Baixar versão anterior (para gerar o delta)
        continue-on-error: true
        run: vpk download github --repoUrl ${{ env.REPO_URL }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Conferir novidades da versão
        shell: bash
        # Nenhuma versão sai sem a nota em Novidades.json (o modal "Novidades" depende dela).
        run: |
          if ! grep -q "\"versao\": *\"${VERSAO}\"" src/CursorSuave/Novidades.json; then
            echo "::error::Falta a entrada da versão ${VERSAO} em src/CursorSuave/Novidades.json"
            exit 1
          fi

      - name: Empacotar
        run: vpk pack -u CursorSuave -v ${{ env.VERSAO }} -p publish -e CursorSuave.exe --packTitle "Cursor Suave"

      - name: Enviar para o GitHub Releases
        run: vpk upload github --repoUrl ${{ env.REPO_URL }} --publish --releaseName "Cursor Suave ${{ env.VERSAO }}" --tag v${{ env.VERSAO }} --token ${{ secrets.GITHUB_TOKEN }}
